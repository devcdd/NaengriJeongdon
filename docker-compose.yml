services:
  postgres:
    image: postgres:latest
    container_name: naengrijeongdon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: naengrijeongdon
      POSTGRES_USER: naengrijeongdon
      POSTGRES_PASSWORD: naengrijeongdon
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
